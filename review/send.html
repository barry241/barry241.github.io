<!doctype html><meta charset="utf-8"><title>Screenshot übergeben</title>
<p>Übergibt den Prüf-Screenshot an App Store Connect …</p>
<script>
// Hilfsseite: reicht den Screenshot an das öffnende App-Store-Connect-Fenster weiter (nur dorthin).
(async () => {
  const buf = await (await fetch('iap_werbefrei.png')).arrayBuffer();
  if (window.opener) window.opener.postMessage({jkShot: buf}, 'https://appstoreconnect.apple.com', [buf]);
  document.querySelector('p').textContent = window.opener ? 'Übergeben.' : 'Kein öffnendes Fenster.';
})();
</script>
